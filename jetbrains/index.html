<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tectrace — Recordings</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="interaction.css">
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 5h6l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" fill="currentColor" fill-opacity=".24"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></symbol>
    <symbol id="database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 10c0 4 16 4 16 0M4 15c0 4 16 4 16 0"/></symbol>
    <symbol id="terminal" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="m6 8 4 4-4 4m7 0h5"/></symbol>
    <symbol id="branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="3"/><circle cx="18" cy="7" r="3"/><path d="M6 8v14m12-12c0 8-12 5-12 5"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="8"/><path d="m16 16 6 6"/></symbol>
    <symbol id="bug" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="13" rx="5"/><path d="m9 7-2-4m8 4 2-4M3 10h4m10 0h4M2 15h5m10 0h5M4 21l4-4m8 0 4 4M12 7V3"/></symbol>
    <symbol id="bell" viewBox="0 0 24 24"><path d="M4 18h16l-3-5V8a5 5 0 0 0-10 0v5zM10 22h4"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><path d="m9 2-1 4-4 1-2 4 3 3-1 4 4 3 4-2 4 2 4-3-1-4 3-3-2-4-4-1-1-4z"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m4 17 5-4 4 3 3-3 5 5"/></symbol>
    <symbol id="layout" viewBox="0 0 24 24"><path d="M3 2v20M3 5h17v7H3m0 3h17v7H3"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5m-4 8a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></symbol>
    <symbol id="table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M9 4v16m6-16v16"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M1 12c5-9 17-9 22 0-5 9-17 9-22 0Z"/><circle cx="12" cy="12" r="4"/></symbol>
  <symbol id="locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></symbol>
<symbol id="expand" viewBox="0 0 24 24"><path d="m8 8 4-4 4 4m-8 8 4 4 4-4"/></symbol>
<symbol id="collapse" viewBox="0 0 24 24"><path d="m8 3 4 4 4-4m-8 18 4-4 4 4"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></symbol>
<symbol id="minus" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>
<symbol id="library" viewBox="0 0 24 24"><path d="M3 8h5v13H3zM9 3h6v18H9zM16 10h5v11h-5z"/></symbol>
<symbol id="scratch" viewBox="0 0 24 24"><path d="M3 6h8M3 10h8M3 15h17M3 19h12"/><circle cx="18" cy="6" r="4" stroke="#5489f4"/><path d="M18 3v3l2 1" stroke="#5489f4"/></symbol>
<symbol id="slider" viewBox="0 0 24 24"><path d="M1 12h7m8 0h7"/><circle cx="12" cy="12" r="4"/></symbol>
<symbol id="services" viewBox="0 0 24 24"><path d="m7 3-5 9 5 9h10l5-9-5-9Z"/><path d="m9 7 7 5-7 5Z"/></symbol>
<symbol id="problem" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v7m0 4v.1"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m6 3 15 9-15 9Z"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M20 9C19 1 3 1 3 10c0 5 5 8 10 7M20 14C20 6 7 6 7 13c0 4 5 6 8 5"/><path d="M12 12h10v10l-4-3h-6Z"/></symbol>
<symbol id="blocks" viewBox="0 0 24 24"><path d="M9 2h7v7H9zM2 9h7v7H2zM9 16v7c8 0 14-6 14-14h-7v7Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="swirl" viewBox="0 0 24 24"><path d="M5 4c10-7 23 4 15 13-5 6-16 2-15-5 1-6 11-7 13-2 3 6-7 9-9 4-2-4 4-6 5-3M18 22C7 26-3 15 3 8"/></symbol>
<symbol id="unlock" viewBox="0 0 24 24"><rect x="3" y="11" width="13" height="10" rx="2"/><path d="M10 11V7a5 5 0 0 1 10 0M7 15v3"/></symbol>
<symbol id="code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m3 8 4 4 10-10M3 17l4-4 4 4 4-4"/></symbol>
<symbol id="connection" viewBox="0 0 24 24"><rect x="2" y="3" width="15" height="16" rx="2"/><path d="M15 14h7v7h-7z"/></symbol>
<symbol id="indent" viewBox="0 0 24 24"><path d="M3 3h15v12M3 3v17h10M6 7h8M6 11h8M6 15h4"/><circle cx="17" cy="17" r="4"/><path d="m20 20 3 3"/></symbol>
</defs></svg>

  <header class="topbar techtrace-topbar">
    <div class="techtrace-brand">
      <svg class="techtrace-logo" viewBox="0 0 35 24" aria-hidden="true"><path d="M10 3a9 9 0 0 0 0 18Z"/><rect x="12" y="3" width="10" height="18" rx="5"/><rect x="24" y="3" width="10" height="18" rx="5"/></svg>
      <span>Tectrace</span>
    </div>
    <button type="button" class="app-settings" aria-label="Settings" title="Settings"><svg aria-hidden="true"><use href="#gear"/></svg></button>
  </header>

  <aside class="rail left-rail" aria-label="Views">
    <button type="button" class="rail-button active folders-rail-toggle" aria-label="Toggle folders panel" aria-expanded="true" aria-controls="folders-panel" title="Recordings"><svg aria-hidden="true"><use href="#folder"/></svg></button>
    <a class="rail-button" href="analyzer.html" aria-label="Analyzer" title="Analyzer"><svg aria-hidden="true"><use href="#slider"/></svg></a>
    <span class="rail-separator" aria-hidden="true"></span>
    <a class="rail-button" href="processing.html" aria-label="Processing" title="Processing"><svg aria-hidden="true"><use href="#layout"/></svg></a>
  </aside>

  <main class="workspace">
    <section class="panel project-panel" id="folders-panel" aria-label="Folders">
      <div class="panel-header project-header">
        <strong>Folders</strong>
        <button class="folders-toggle" type="button" aria-label="Hide folders panel" title="Hide folders panel"><svg aria-hidden="true"><use href="#minus"/></svg></button>
      </div>
      <div class="file-tree" id="folder-list" aria-label="Folder selection">Loading folders…</div>
    </section>

    <div class="panel-divider" role="separator" aria-label="Resize folders panel" aria-orientation="vertical" aria-controls="folders-panel" aria-valuemin="15" aria-valuemax="55" aria-valuenow="30" tabindex="0"></div>

    <section class="panel editor-panel recordings-panel" aria-label="Recordings data table">
      <div class="panel-header recordings-header">
        <strong>Recordings</strong>
        <span class="last-scan">Last scanned <time id="last-scan-time">Loading…</time></span>
        <button type="button" class="scan-retry" id="scan-retry" aria-label="Retry mock scan" title="Retry mock scan"><svg aria-hidden="true"><use href="#refresh"/></svg></button>
      </div>
      <div class="recordings-toolbar">
        <label class="recordings-search"><svg aria-hidden="true"><use href="#search"/></svg><input id="recording-search" type="search" placeholder="Search recordings…" aria-label="Search recordings"></label>
        <select class="recording-filter" id="status-filter" aria-label="Filter by status"><option value="">All statuses</option><option>Ready</option><option>Processing</option></select>
        <select class="recording-filter" id="health-filter" aria-label="Filter by health"><option value="">All health</option><option>Healthy</option><option>Warning</option><option>Not checked</option></select>
        <button type="button" class="filter-reset" id="reset-filters" aria-label="Reset search and filters" title="Reset search and filters"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8a8 8 0 1 1-1 8M4 3v5h5"/></svg></button>
        <button type="button" class="prepare-selected" id="prepare-selected" hidden>Prepare selected</button>
      </div>
      <div class="recordings-table-scroll">
        <table class="recordings-table">
          <thead><tr><th class="checkbox-cell" scope="col"><input type="checkbox" id="select-all-recordings" aria-label="Select all visible recordings"></th><th scope="col">Name</th><th scope="col">Recorded</th><th scope="col" class="numeric">Duration</th><th scope="col" class="numeric">Size</th><th scope="col">Status</th><th scope="col">Health</th></tr></thead>
          <tbody id="recordings-body"></tbody>
        </table>
        <div class="recordings-empty" id="recordings-empty" hidden><strong>No matching recordings</strong><span>Try another search or clear the filters.</span></div>
      </div>
    </section>

  </main>

  <script src="common.js"></script>
  <script src="script.js"></script>
</body>
</html>
